job_type: cg

{{ template "job-config" . }}

# container image for createsims (should be loaded into cluster)
image: {{ .Job.Image }}
namespace: {{ if .Mummi.Namespace }}{{ .Mummi.Namespace }}{{ else }}default{{ end }}
imports:  # possibly needed for any evals
  - mummi_ras

variables:
  simname: null # value supplied by jobTracker
  timestamp: null # value supplied by jobTracker
  outpath:
    eval: mummi_ras.Naming.dir_sim('cg', '{simname}')
  locpath:
    eval: mummi_ras.Naming.dir_local('cg/{simname}')
  fbpath:
    eval: mummi_ras.Naming.dir_root('feedback-cg')
  outfile: 'cg_analysis.out'

script: |
  . ~/.bash_profile
  export OMPI_COMM_WORLD_RANK=1

  {{ template "mummi-vars" . }}

  # This could be the .Job.Config.CoresPerTask, but since that is used for schedulign (and we have to ask
  # for less) we set it to nproc
  export OMP_NUM_THREADS=$(nproc)

  simname={simname}
  locpath=/tmp/workdir
  outpath=/tmp/out
  outfile={outfile}

  # registry="registry-0.mini-mummi.default.svc.cluster.local:5000"
  registry="{{ .Mummi.RegistryHost }}"

  echo ">> simname  = $simname"
  echo ">> outpath  = $outpath"
  echo ">> registry = $registry"
  echo ">> locpath  = $locpath"
  echo ">> gmx      =" $(command -v gmx)
  echo ">> pwd      =" $(pwd)
  echo ">> hostname =" $(hostname)

  mkdir -p $outpath
  mkdir -p -v $locpath; cd $locpath

  # cganalysis comes after createsims
  tag=createsim
  uri=$registry/$simname:$tag
  {{ template "oras-pull" . }}
  ls
  tar -xzvf createsims-output.tar.gz
  cd tmp/out

  # Note - for Kubernetes outpath will always be empty
  cframe=0
  echo ">> xtclast = $xtclast, cframe = $cframe"

  {{ if .Job.Interactive }}sleep infinity{{ end }}

  time mummi_cganalysis \
                      --simname $simname \
                      --path $locpath/tmp/out {{ if eq .Job.Config.Gpus 0 }}--no-gpu{{ end }} \
                      --pathremote $outpath \
                      --siminputs $outpath \
                      --fstype mummi \
                      --fbio mummi \
                      --simbin gmx \
                      --backend GROMACS_PARTS \
                      --simcores $OMP_NUM_THREADS \
                      --nprocs 1 \
                      --stopsimtime 100 \
                      --simruntime 0.5 \
                      --logstdout \
                      --loglevel 2 \
                      --mini \
                      --fcount $cframe 2>&1 | tee $outfile

  retval=$?
  if [ $retval -eq 0 ];
    then
      # Tar gz up the entire path (including createsims.tar.gz)
      cd $outpath
      tar czf cganalysis-output.tar.gz /tmp/out
      echo "Simulation was successful, pushing result to $registry/$simname:cganalysis"
      oras push {{ if .Spec.Registry.PlainHttp }}--plain-http{{ end }} {{ if .Spec.Registry.TLSVerify }}{{ else }}--insecure{{ end }} $registry/$simname:cganalysis cganalysis-output.tar.gz
  else
      cd $outpath
      tar czf cganalysis-output.tar.gz /tmp/out
      echo "Simulation had non zero exit code, pushing result to $registry/$simname:cganalysis-fail"
      oras push {{ if .Spec.Registry.PlainHttp }}--plain-http{{ end }} {{ if .Spec.Registry.TLSVerify }}{{ else }}--insecure{{ end }} $registry/$simname:cganalysis-fail cganalysis-output.tar.gz
  fi
  ls $outpath
  wait
