[project]
name = "mummi-wfmanager"
version = "0.1.0"
authors = ["Vanessa Sochat <sochat1@llnl.gov>"]
channels = ["conda-forge"]
platforms = ["linux-64"]
description = "The wfmanager component for a MuMMI container build"
license = "MIT"

[host-dependencies]
python = ">3.9,<=3.11"

[build-dependencies]
cmake = "~=3.24"
pkg-config = "~=0.29.2"

[dependencies]
pandas = "2.1.1.*"
scikit-learn = "1.3.1.*"
xgboost = "1.7.6.*"
h5py = "3.10.0.*"
keras = "2.13.1.*"
keras-applications = "1.0.8.*"
keras-preprocessing = "1.1.2.*"
gcc = "13.2.0.*"
gxx = "13.2.0.*"
git = "2.42.0.*"
which = "2.21.*"
pip = "23.2.1.*"
faiss = ">=1.7.4,<1.8"
tensorflow = ">=2.13.1,<2.14"
